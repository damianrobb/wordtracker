<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Word Tracker">
  <meta name="theme-color" content="#c4d0a8">
  <title>Word Tracker</title>
  <link rel="manifest" href="manifest.json?v=5">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #c4d0a8;
      --surface: rgba(255,255,255,0.55);
      --text: #1a1a1a;
      --text-muted: #666;
      --border: rgba(0,0,0,0.1);
      --radius: 10px;
    }

    html, body {
      height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    .app {
      min-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 24px);
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: inherit;
    }

    /* ── Header ── */
    .header { text-align: center; padding-top: 8px; }
    .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
    .header-badges { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; }
    .month-badge {
      display: inline-block;
      font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
      text-transform: uppercase; padding: 3px 12px; border-radius: 20px;
      cursor: pointer; transition: opacity 0.15s;
    }
    .month-badge:active { opacity: 0.7; }
    .year-toggle {
      font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase; padding: 3px 10px; border-radius: 20px;
      border: 1.5px solid var(--border); background: none;
      cursor: pointer; color: var(--text-muted);
      -webkit-tap-highlight-color: transparent;
    }
    .year-toggle.active { color: var(--text); border-color: currentColor; }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { border-radius: var(--radius); padding: 12px 8px; text-align: center; }
    .stat-num { font-size: 26px; font-weight: 600; line-height: 1; }
    .stat-label { font-size: 11px; margin-top: 3px; opacity: 0.65; }

    /* ── Month nav ── */
    .month-nav { display: flex; align-items: center; justify-content: space-between; }
    .month-nav button {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius); width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text); font-size: 18px;
      -webkit-tap-highlight-color: transparent;
    }
    .month-nav button:active { opacity: 0.5; }
    .month-title { font-size: 17px; font-weight: 600; }

    /* ── Calendar ── */
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 4px; }
    .weekday { text-align: center; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); padding: 2px 0; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .day {
      aspect-ratio: 1; border-radius: 8px; border: 0.5px solid var(--border);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; background: var(--surface); transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent; position: relative;
    }
    .day:active { transform: scale(0.85); }
    .day.empty { border: none; background: none; cursor: default; pointer-events: none; }
    .day.today { border-width: 1.5px; }
    .day.has-note::after {
      content: ''; position: absolute; bottom: 3px; right: 3px;
      width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.4;
    }
    .day-num { font-size: 12px; line-height: 1; color: var(--text-muted); }
    .day.today .day-num { font-weight: 600; }
    .check { font-size: 14px; line-height: 1; margin-top: 1px; }

    /* ── Note panel ── */
    .note-panel {
      border-radius: var(--radius); overflow: hidden;
      max-height: 0; transition: max-height 0.4s ease, opacity 0.3s ease;
      opacity: 0; pointer-events: none;
    }
    .note-panel.open { max-height: 1000px; opacity: 1; pointer-events: all; }
    .note-inner { padding: 12px; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); }
    .note-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 8px; }
    .note-textarea {
      width: 100%; border: none; background: none; resize: none;
      font-family: inherit; font-size: 14px; color: var(--text);
      outline: none; min-height: 120px; line-height: 1.5;
    }
    .note-textarea::placeholder { color: var(--text-muted); }
    .note-close {
      display: flex; justify-content: flex-end; margin-top: 8px;
    }
    .note-save-btn {
      font-size: 12px; font-weight: 600; padding: 5px 14px;
      border-radius: 20px; border: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Streak dots ── */
    .streak-section { }
    .streak-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 6px; }
    .streak-dots { display: flex; gap: 3px; flex-wrap: wrap; }
    .streak-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(0,0,0,0.12); }

    /* ── Year view ── */
    .year-view { display: none; flex-direction: column; gap: 16px; }
    .year-view.active { display: flex; }
    .year-nav { display: flex; align-items: center; justify-content: space-between; }
    .year-nav button {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius); width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text); font-size: 18px;
      -webkit-tap-highlight-color: transparent;
    }
    .year-nav button:active { opacity: 0.5; }
    .year-title { font-size: 17px; font-weight: 600; }
    .year-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .mini-month { border-radius: var(--radius); padding: 10px 8px; background: var(--surface); border: 0.5px solid var(--border); cursor: pointer; }
    .mini-month:active { opacity: 0.7; }
    .mini-month-name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .mini-day { width: 100%; aspect-ratio: 1; border-radius: 2px; background: rgba(0,0,0,0.06); }
    .mini-day.written { }
    .mini-day.empty-day { background: none; }
    .mini-month-count { font-size: 10px; margin-top: 6px; opacity: 0.6; }

    /* ── Calendar view wrapper ── */
    .calendar-view { display: flex; flex-direction: column; gap: 18px; }
    .calendar-view.hidden { display: none; }

    /* ── Word counter ── */
    .word-counter { margin-bottom: 12px; }
    .word-counter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .word-count-display { font-size: 28px; font-weight: 700; line-height: 1; transition: color 0.3s; }
    .word-count-goal { font-size: 12px; opacity: 0.5; margin-left: 2px; align-self: flex-end; padding-bottom: 3px; }
    .word-count-flourish { font-size: 14px; opacity: 0; transition: opacity 0.4s; }
    .word-count-flourish.show { opacity: 1; }
    .word-input-row { display: flex; gap: 6px; }
    .word-input {
      flex: 1; border: 0.5px solid var(--border); border-radius: 8px;
      padding: 7px 10px; font-size: 14px; font-family: inherit;
      background: var(--bg); color: var(--text); outline: none;
    }
    .word-input:focus { border-color: currentColor; }
    .word-add-btn {
      padding: 7px 14px; border-radius: 8px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .word-reset-btn {
      padding: 7px 10px; border-radius: 8px; border: 0.5px solid var(--border);
      font-size: 12px; background: none; cursor: pointer; color: var(--text-muted);
      -webkit-tap-highlight-color: transparent;
    }
    .monthly-words { margin-top: 10px; }
    .monthly-words-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 4px; }
    .monthly-words-count { font-size: 15px; font-weight: 600; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
      left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: 20px;
      font-size: 14px; font-weight: 500;
      opacity: 0; transition: opacity 0.25s;
      pointer-events: none; white-space: nowrap; z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>1000 words a day</h1>
    <div class="header-badges">
      <div class="month-badge" id="month-badge"></div>
      <button class="year-toggle" id="year-toggle">Year</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat" id="stat-box-total"><div class="stat-num" id="stat-total">0</div><div class="stat-label">written</div></div>
    <div class="stat" id="stat-box-streak"><div class="stat-num" id="stat-streak">0</div><div class="stat-label">streak</div></div>
    <div class="stat" id="stat-box-month"><div class="stat-num" id="stat-month">0</div><div class="stat-label">this month</div></div>
  </div>

  <!-- Calendar view -->
  <div class="calendar-view" id="calendar-view">
    <div class="month-nav">
      <button id="prev-btn" aria-label="Previous month"><i class="ti ti-chevron-left"></i></button>
      <div class="month-title" id="month-title"></div>
      <button id="next-btn" aria-label="Next month"><i class="ti ti-chevron-right"></i></button>
    </div>

    <div>
      <div class="weekdays">
        <div class="weekday">M</div><div class="weekday">T</div><div class="weekday">W</div>
        <div class="weekday">T</div><div class="weekday">F</div><div class="weekday">S</div>
        <div class="weekday">S</div>
      </div>
      <div class="grid" id="cal-grid"></div>
    </div>

    <div class="streak-section">
      <div class="streak-label">month so far</div>
      <div class="streak-dots" id="streak-dots"></div>
    </div>
    <div class="monthly-words">
      <div class="monthly-words-label">words this month</div>
      <div class="monthly-words-count" id="monthly-words-count">0</div>
    </div>

    <div class="note-panel" id="note-panel">
      <div class="note-inner">
        <div class="word-counter" id="word-counter">
          <div class="word-counter-row">
            <div class="word-count-display" id="word-count-display">0</div>
            <div class="word-count-goal">/ 1000</div>
            <div class="word-count-flourish" id="word-count-flourish">✦</div>
          </div>
          <div class="word-input-row">
            <input class="word-input" id="word-input" type="number" min="0" placeholder="add words…">
            <button class="word-add-btn" id="word-add-btn">+</button>
            <button class="word-reset-btn" id="word-reset-btn">Reset</button>
          </div>
        </div>
        <div class="note-label" id="note-label">Note</div>
        <textarea class="note-textarea" id="note-textarea" placeholder="What did you work on?"></textarea>
        <div class="note-close">
          <button class="note-save-btn" id="note-save-btn">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Year view -->
  <div class="year-view" id="year-view">
    <div class="year-nav">
      <button id="year-prev-btn" aria-label="Previous year"><i class="ti ti-chevron-left"></i></button>
      <div class="year-title" id="year-title"></div>
      <button id="year-next-btn" aria-label="Next year"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="year-grid" id="year-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PALETTES = [
  // Jan: cool slate
  { bg:'#c8d4e0', fill:'#1e3a52', accent:'#b8d4f0', statBg:'rgba(255,255,255,0.45)', statNum:'#1e3a52', badgeBg:'#dde6ee', badgeText:'#1e3a52', surface:'rgba(255,255,255,0.55)' },
  // Feb: dusty mauve
  { bg:'#ddd0e0', fill:'#5a2e6e', accent:'#e8c8f0', statBg:'rgba(255,255,255,0.45)', statNum:'#5a2e6e', badgeBg:'#ece0ee', badgeText:'#5a2e6e', surface:'rgba(255,255,255,0.55)' },
  // Mar: sage green
  { bg:'#c8d4b8', fill:'#2a4a1e', accent:'#c8e8a8', statBg:'rgba(255,255,255,0.45)', statNum:'#2a4a1e', badgeBg:'#d8e4c8', badgeText:'#2a4a1e', surface:'rgba(255,255,255,0.55)' },
  // Apr: warm mushroom
  { bg:'#d4ccc0', fill:'#4a3828', accent:'#e8d8c0', statBg:'rgba(255,255,255,0.45)', statNum:'#4a3828', badgeBg:'#e0d8cc', badgeText:'#4a3828', surface:'rgba(255,255,255,0.55)' },
  // May: your sage green
  { bg:'#c4d0a8', fill:'#3a5020', accent:'#d4e8a8', statBg:'rgba(255,255,255,0.45)', statNum:'#3a5020', badgeBg:'#d4e0b8', badgeText:'#3a5020', surface:'rgba(255,255,255,0.55)' },
  // Jun: warm terracotta
  { bg:'#e0c8b8', fill:'#6a2e18', accent:'#f0c8a8', statBg:'rgba(255,255,255,0.45)', statNum:'#6a2e18', badgeBg:'#ead8c8', badgeText:'#6a2e18', surface:'rgba(255,255,255,0.55)' },
  // Jul: deep teal
  { bg:'#b8d0d0', fill:'#1a4848', accent:'#a8d8d8', statBg:'rgba(255,255,255,0.45)', statNum:'#1a4848', badgeBg:'#cce0e0', badgeText:'#1a4848', surface:'rgba(255,255,255,0.55)' },
  // Aug: dusty gold
  { bg:'#e0d0a0', fill:'#5a4010', accent:'#f0d870', statBg:'rgba(255,255,255,0.45)', statNum:'#5a4010', badgeBg:'#ecdeb8', badgeText:'#5a4010', surface:'rgba(255,255,255,0.55)' },
  // Sep: warm rose
  { bg:'#e0c8c8', fill:'#6a2030', accent:'#f0b0b8', statBg:'rgba(255,255,255,0.45)', statNum:'#6a2030', badgeBg:'#ecd8d8', badgeText:'#6a2030', surface:'rgba(255,255,255,0.55)' },
  // Oct: burnt orange
  { bg:'#e8c8a0', fill:'#6a3000', accent:'#f8c060', statBg:'rgba(255,255,255,0.45)', statNum:'#6a3000', badgeBg:'#f0d8b8', badgeText:'#6a3000', surface:'rgba(255,255,255,0.55)' },
  // Nov: cool grey-green
  { bg:'#c0ccc0', fill:'#2a3e2a', accent:'#a8c8a0', statBg:'rgba(255,255,255,0.45)', statNum:'#2a3e2a', badgeBg:'#d0dcd0', badgeText:'#2a3e2a', surface:'rgba(255,255,255,0.55)' },
  // Dec: midnight indigo
  { bg:'#c4c8e0', fill:'#1e1e4a', accent:'#b8c0f0', statBg:'rgba(255,255,255,0.45)', statNum:'#1e1e4a', badgeBg:'#d4d8ee', badgeText:'#1e1e4a', surface:'rgba(255,255,255,0.55)' },
];

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
// ── Supabase ──
const SUPABASE_URL = 'https://xfrkbgkfsubgylyrashs.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmcmtiZ2tmc3ViZ3lseXJhc2hzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMDg2MzIsImV4cCI6MjA5NTc4NDYzMn0.ep6V2AAMm1C36mefEj5SpiYptiT3PDM0Ro5YVMF3ANI';

async function sbFetch(method, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/entries`, {
    method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'resolution=merge-duplicates,return=minimal' : 'return=minimal',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  return res;
}

async function loadAllData() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/entries?select=*`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  const rows = await res.json();
  written = new Set();
  notes = {};
  wordCounts = {};
  for (const row of rows) {
    if (row.written) written.add(row.date);
    if (row.note) notes[row.date] = row.note;
    if (row.words) wordCounts[row.date] = row.words;
  }
}

async function saveEntry(dateKey) {
  const entry = {
    date: dateKey,
    written: written.has(dateKey),
    words: wordCounts[dateKey] || 0,
    note: notes[dateKey] || '',
  };
  await sbFetch('POST', [entry]);
}

// Local state
let written = new Set();
let notes = {};
let wordCounts = {};

function getMonthlyWords(y, m){
  return Object.entries(wordCounts).reduce((sum, [k, v]) => {
    const [ky, km] = k.split('-').map(Number);
    return (ky === y && km-1 === m) ? sum + v : sum;
  }, 0);
}

function updateMonthlyWords(){
  const total = getMonthlyWords(viewYear, viewMonth);
  const el = document.getElementById('monthly-words-count');
  if(el) el.textContent = total.toLocaleString();
}

const today = new Date(); today.setHours(0,0,0,0);
let viewYear = today.getFullYear();
let viewMonth = today.getMonth();
let yearViewYear = today.getFullYear();
let showingYear = false;
let activeNoteKey = null;

function dk(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function save(dateKey){ saveEntry(dateKey); }
function saveNotes(dateKey){ if(dateKey) saveEntry(dateKey); }
function p(m){ return PALETTES[m]; }

function toast(msg, pal){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = pal.fill; t.style.color = pal.accent;
  t.classList.add('show'); clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

function streak(){
  let s=0, d=new Date(today);
  while(written.has(dk(d.getFullYear(),d.getMonth(),d.getDate()))){ s++; d.setDate(d.getDate()-1); }
  return s;
}

function monthCount(y,m){
  return [...written].filter(k=>{ const [ky,km]=k.split('-').map(Number); return ky===y&&km-1===m; }).length;
}

function applyChrome(pal){
  // Page background + status bar theme colour
  document.documentElement.style.background = pal.bg;
  document.body.style.background = pal.bg;
  document.body.style.minHeight = '100dvh';
  const appEl = document.querySelector('.app');
  if(appEl) appEl.style.background = pal.bg;
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  if(themeMeta) themeMeta.setAttribute('content', pal.bg);

  const badge = document.getElementById('month-badge');
  badge.textContent = MONTHS[viewMonth];
  badge.style.background = pal.badgeBg;
  badge.style.color = pal.badgeText;

  ['total','streak','month'].forEach(id=>{
    document.getElementById(`stat-box-${id}`).style.background = pal.statBg;
    document.getElementById(`stat-${id}`).style.color = pal.statNum;
    document.getElementById(`stat-box-${id}`).querySelector('.stat-label').style.color = pal.statNum;
  });

  // Nav buttons
  document.querySelectorAll('.month-nav button, .year-nav button').forEach(btn => {
    btn.style.background = pal.surface;
    btn.style.borderColor = 'rgba(0,0,0,0.12)';
  });

  // Year toggle
  const yt = document.getElementById('year-toggle');
  yt.style.background = pal.surface;
  yt.style.color = pal.fill;
  yt.style.borderColor = pal.fill;

  // Note panel
  const noteInner = document.querySelector('.note-inner');
  if(noteInner) noteInner.style.background = pal.surface;
  const btn = document.getElementById('note-save-btn');
  btn.style.background = pal.fill;
  btn.style.color = pal.accent;

  // Word add button
  const addBtn = document.getElementById('word-add-btn');
  if(addBtn){ addBtn.style.background = pal.fill; addBtn.style.color = pal.accent; }

  // monthly words colour
  const mw = document.getElementById('monthly-words-count');
  if(mw) mw.style.color = pal.fill;

  // CSS variable for day surface
  document.documentElement.style.setProperty('--month-surface', pal.surface);
  document.documentElement.style.setProperty('--month-fill', pal.fill);
  document.documentElement.style.setProperty('--month-bg', pal.bg);
}

function updateStats(){
  document.getElementById('stat-total').textContent = written.size;
  document.getElementById('stat-streak').textContent = streak();
  document.getElementById('stat-month').textContent = monthCount(viewYear, viewMonth);
}

function renderStreak(pal){
  const c = document.getElementById('streak-dots'); c.innerHTML='';
  const days = new Date(viewYear, viewMonth+1, 0).getDate();
  for(let d=1;d<=days;d++){
    const on=written.has(dk(viewYear, viewMonth, d));
    const dot=document.createElement('div');
    dot.className='streak-dot';
    if(on) dot.style.background=pal.fill;
    c.appendChild(dot);
  }
}

// ── Note panel ──
function openNote(k, dayLabel, pal){
  activeNoteKey = k;
  const panel = document.getElementById('note-panel');
  const textarea = document.getElementById('note-textarea');
  const label = document.getElementById('note-label');
  label.textContent = dayLabel;
  textarea.value = notes[k] || '';

  // Always sync note panel colours to current month
  const noteInner = document.querySelector('.note-inner');
  if(noteInner) noteInner.style.background = pal.surface;
  document.getElementById('note-save-btn').style.background = pal.fill;
  document.getElementById('note-save-btn').style.color = pal.accent;
  const addBtn = document.getElementById('word-add-btn');
  if(addBtn){ addBtn.style.background = pal.fill; addBtn.style.color = pal.accent; }

  // word counter
  const count = wordCounts[k] || 0;
  updateWordDisplay(count, pal);

  panel.classList.add('open');
  setTimeout(()=> document.getElementById('word-input').focus(), 320);
}

function updateWordDisplay(count, pal){
  const display = document.getElementById('word-count-display');
  const flourish = document.getElementById('word-count-flourish');
  const addBtn = document.getElementById('word-add-btn');
  display.textContent = count.toLocaleString();
  if(count >= 1000){
    display.style.color = pal.fill;
    flourish.style.color = pal.fill;
    flourish.classList.add('show');
  } else {
    display.style.color = '';
    flourish.classList.remove('show');
  }
  addBtn.style.background = pal.fill;
  addBtn.style.color = pal.accent;
}

function closeNote(){
  const panel = document.getElementById('note-panel');
  const textarea = document.getElementById('note-textarea');
  if(activeNoteKey !== null){
    const val = textarea.value.trim();
    if(val) notes[activeNoteKey] = val;
    else delete notes[activeNoteKey];
    saveNotes(activeNoteKey);
  }
  panel.classList.remove('open');
  activeNoteKey = null;
  render();
  updateMonthlyWords();
}

document.getElementById('note-save-btn').addEventListener('click', closeNote);

// ── Calendar ──
function render(){
  const pal = p(viewMonth);
  const grid = document.getElementById('cal-grid'); grid.innerHTML='';
  document.getElementById('month-title').textContent = `${MONTHS[viewMonth]} ${viewYear}`;

  const firstDay = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7;
  const days = new Date(viewYear, viewMonth+1, 0).getDate();

  for(let i=0;i<firstDay;i++){
    const e=document.createElement('div'); e.className='day empty'; grid.appendChild(e);
  }

  for(let d=1;d<=days;d++){
    const k = dk(viewYear, viewMonth, d);
    const isToday = new Date(viewYear,viewMonth,d).getTime()===today.getTime();
    const isWritten = written.has(k);
    const hasNote = !!notes[k];

    const cell = document.createElement('div');
    let cls = 'day'+(isToday?' today':'')+(isWritten?' written':'')+(hasNote?' has-note':'');
    cell.className = cls;

    if(isWritten){
      cell.style.background = pal.fill;
      cell.style.borderColor = pal.fill;
      cell.style.color = pal.accent;
    } else if(isToday){
      cell.style.borderColor = pal.fill;
    }

    const num = document.createElement('div');
    num.className='day-num'; num.textContent=d;
    if(isWritten) num.style.color=pal.accent;
    else if(isToday) num.style.color=pal.fill;
    cell.appendChild(num);

    if(isWritten){
      const chk=document.createElement('div');
      chk.className='check'; chk.textContent='✓'; chk.style.color=pal.accent;
      cell.appendChild(chk);
    }

    cell.addEventListener('click', ()=>{
      // If note panel is open for a different day, close it first
      if(activeNoteKey !== null && activeNoteKey !== k){ closeNote(); }

      // Toggle written
      const cp=p(viewMonth);
      if(written.has(k)){ written.delete(k); toast('unmarked',cp); }
      else {
        written.add(k);
        const s=streak();
        if(s>=30) toast(`🔥 ${s} days. Legendary.`,cp);
        else if(s>=14) toast(`🔥 ${s} day streak!`,cp);
        else if(s>=7) toast(`🔥 ${s} days in a row!`,cp);
        else toast('1000 words ✓',cp);
      }
      save(k); render(); renderStreak(p(viewMonth)); updateStats(); applyChrome(p(viewMonth));
    });

    cell.addEventListener('dblclick', (e)=>{
      e.stopPropagation();
      const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      openNote(k, `${d} ${MONTHS_SHORT[viewMonth]} ${viewYear}`, p(viewMonth));
    });

    // Long press for note on mobile
    let pressTimer;
    cell.addEventListener('touchstart', ()=>{
      pressTimer = setTimeout(()=>{
        const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        openNote(k, `${d} ${MONTHS_SHORT[viewMonth]} ${viewYear}`, p(viewMonth));
      }, 500);
    }, {passive:true});
    cell.addEventListener('touchend', ()=> clearTimeout(pressTimer), {passive:true});
    cell.addEventListener('touchmove', ()=> clearTimeout(pressTimer), {passive:true});

    grid.appendChild(cell);
  }
  applyChrome(pal); renderStreak(pal); updateStats(); updateMonthlyWords();
}

// ── Year view ──
function renderYearView(){
  const grid = document.getElementById('year-grid'); grid.innerHTML='';
  document.getElementById('year-title').textContent = yearViewYear;

  // no year restrictions — allow past and future
  document.getElementById('year-next-btn').style.opacity = '1';
  document.getElementById('year-next-btn').disabled = false;

  for(let m=0;m<12;m++){
    const pal = p(m);
    const daysInMonth = new Date(yearViewYear, m+1, 0).getDate();
    const firstDay = (new Date(yearViewYear, m, 1).getDay() + 6) % 7;
    const count = monthCount(yearViewYear, m);

    const mini = document.createElement('div');
    mini.className = 'mini-month';
    mini.style.borderColor = pal.badgeBg;

    const name = document.createElement('div');
    name.className = 'mini-month-name';
    name.textContent = MONTHS[m].slice(0,3).toUpperCase();
    name.style.color = pal.fill;
    mini.appendChild(name);

    const miniGrid = document.createElement('div');
    miniGrid.className = 'mini-grid';

    for(let i=0;i<firstDay;i++){
      const e=document.createElement('div'); e.className='mini-day empty-day'; miniGrid.appendChild(e);
    }
    for(let d=1;d<=daysInMonth;d++){
      const k=dk(yearViewYear,m,d);
      const dot=document.createElement('div');
      dot.className='mini-day'+(written.has(k)?' written':'');
      if(written.has(k)) dot.style.background=pal.fill;
      miniGrid.appendChild(dot);
    }
    mini.appendChild(miniGrid);

    const countEl = document.createElement('div');
    countEl.className = 'mini-month-count';
    countEl.textContent = count > 0 ? `${count} day${count===1?'':'s'}` : '–';
    countEl.style.color = pal.fill;
    mini.appendChild(countEl);

    // Tap to jump to that month
    mini.addEventListener('click', ()=>{
      viewYear = yearViewYear;
      viewMonth = m;
      toggleYearView(false);
    });

    grid.appendChild(mini);
  }
}

function toggleYearView(show){
  showingYear = show;
  document.getElementById('calendar-view').classList.toggle('hidden', show);
  document.getElementById('year-view').classList.toggle('active', show);
  document.getElementById('year-toggle').classList.toggle('active', show);
  document.getElementById('year-toggle').textContent = show ? 'Calendar' : 'Year';
  if(show){
    yearViewYear = today.getFullYear();
    renderYearView();
  } else {
    render();
  }
}

document.getElementById('year-toggle').addEventListener('click', ()=> toggleYearView(!showingYear));
document.getElementById('month-badge').addEventListener('click', ()=>{ if(showingYear) toggleYearView(false); });

document.getElementById('prev-btn').addEventListener('click',()=>{ viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} closeNoteQuiet(); render(); });
document.getElementById('next-btn').addEventListener('click',()=>{ viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} closeNoteQuiet(); render(); });

document.getElementById('year-prev-btn').addEventListener('click',()=>{ yearViewYear--; renderYearView(); });
document.getElementById('year-next-btn').addEventListener('click',()=>{ yearViewYear++; renderYearView(); });

function closeNoteQuiet(){
  // Save without re-rendering (render is about to happen)
  const textarea = document.getElementById('note-textarea');
  if(activeNoteKey !== null){
    const val = textarea.value.trim();
    if(val) notes[activeNoteKey] = val;
    else delete notes[activeNoteKey];
    saveNotes(activeNoteKey);
  }
  document.getElementById('note-panel').classList.remove('open');
  activeNoteKey = null;
}

// Word counter buttons
document.getElementById('word-add-btn').addEventListener('click', ()=>{
  if(!activeNoteKey) return;
  const input = document.getElementById('word-input');
  const val = parseInt(input.value);
  if(!val || val <= 0) return;
  wordCounts[activeNoteKey] = (wordCounts[activeNoteKey] || 0) + val;
  saveEntry(activeNoteKey);
  input.value = '';
  updateWordDisplay(wordCounts[activeNoteKey], p(viewMonth));
  updateMonthlyWords();
});

document.getElementById('word-input').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('word-add-btn').click();
});

document.getElementById('word-reset-btn').addEventListener('click', ()=>{
  if(!activeNoteKey) return;
  delete wordCounts[activeNoteKey];
  saveEntry(activeNoteKey);
  updateWordDisplay(0, p(viewMonth));
  updateMonthlyWords();
});

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }

// Show loading state then load data
document.getElementById('month-title').textContent = 'Loading…';
loadAllData().then(() => {
  render();
}).catch(err => {
  console.error('Failed to load from Supabase:', err);
  render();
});
</script>
</body>
</html>
